[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "scraperack"
version = "0.1.0a1"
description = "Python SDK for self-hosted ScrapeRack clusters"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["cloudpickle>=3", "httpx>=0.27"]
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = ["Development Status :: 3 - Alpha"]

[project.urls]
Repository = "https://github.com/damadjan/scraperack"
Issues = "https://github.com/damadjan/scraperack/issues"

[tool.setuptools.package-data]
scraperack = ["py.typed"]
