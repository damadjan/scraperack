name: scraperack

x-ray-common: &ray-common
  image: ${SCRAPERACK_IMAGE:-scraperack:dev}
  build:
    context: platform
  pull_policy: ${SCRAPERACK_PULL_POLICY:-build}
  environment:
    RAY_USAGE_STATS_ENABLED: "0"

services:
  control-plane:
    <<: *ray-common
    shm_size: 256mb
    command:
      - ray
      - start
      - --head
      - --port=6379
      - --dashboard-host=0.0.0.0
      - --ray-client-server-port=10001
      - --num-cpus=0
      - --object-store-memory=104857600
      - --block
    healthcheck:
      test: ["CMD", "ray", "health-check", "--address=127.0.0.1:6379"]
      interval: 5s
      timeout: 5s
      retries: 12

  gateway:
    <<: *ray-common
    environment:
      RAY_ADDRESS: ray://control-plane:10001
      RAY_USAGE_STATS_ENABLED: "0"
      RAY_PIP_CACHING: ${RAY_PIP_CACHING:-true}
      SCRAPERACK_WORKING_DIR_CACHE: /home/scraperack/.cache/working-dirs
      SCRAPERACK_WORKING_DIR_BASE_URL: http://gateway:8080/working-dirs
    volumes:
      - working-dir-cache:/home/scraperack/.cache/working-dirs
    ports:
      - ${SCRAPERACK_BIND_ADDRESS:-127.0.0.1}:${SCRAPERACK_PORT:-42800}:8080
    depends_on:
      control-plane:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 5s
      timeout: 5s
      retries: 12

  node:
    <<: *ray-common
    shm_size: 256mb
    environment:
      PIP_CACHE_DIR: /home/scraperack/.cache/pip
      RAY_USAGE_STATS_ENABLED: "0"
    volumes:
      - pip-cache:/home/scraperack/.cache/pip
    command:
      - ray
      - start
      - --address=control-plane:6379
      - --object-store-memory=104857600
      - --block
    depends_on:
      control-plane:
        condition: service_healthy

volumes:
  pip-cache:
  working-dir-cache:
